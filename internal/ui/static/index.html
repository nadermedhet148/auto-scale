<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dockscale</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='3' height='6' rx='1' fill='%232a78d6'/%3E%3Crect x='6.5' y='5' width='3' height='10' rx='1' fill='%232a78d6'/%3E%3Crect x='12' y='1' width='3' height='14' rx='1' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>dockscale</h1>
      <span id="banner" class="pill" hidden></span>
    </div>
    <div class="meta" id="meta" aria-live="polite"></div>
    <button id="theme" class="ghost" type="button" title="Theme: follows your system">Theme: auto</button>
  </header>

  <div id="alert" class="alert" role="alert" hidden></div>

  <nav class="filters" aria-label="Filters">
    <label class="field">Service
      <select id="service"></select>
    </label>
    <div class="seg" role="group" aria-label="Time range" id="range">
      <button type="button" data-window="15m">15m</button>
      <button type="button" data-window="1h" aria-pressed="true">1h</button>
      <button type="button" data-window="3h">3h</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
      <button type="button" role="tab" data-tab="decisions" aria-selected="false">Decisions</button>
      <button type="button" role="tab" data-tab="profile" aria-selected="false">Load profile</button>
    </div>
  </nav>

  <main>
    <section id="tab-overview" role="tabpanel">
      <div id="services" class="card" hidden></div>
      <div id="tiles" class="tiles"></div>
      <p id="reason" class="reason"></p>
      <figure id="chart-replicas" class="card chart"></figure>
      <div id="signal-charts" class="grid"></div>
    </section>

    <section id="tab-decisions" role="tabpanel" hidden>
      <div id="verdict-tiles" class="tiles"></div>
      <div id="advice" class="card advice"></div>
      <div class="card">
        <div class="fig-head"><div><h3>Recent decisions</h3><p class="sub">Each scaling action, graded after its evaluation window. Newest first.</p></div></div>
        <div class="table-wrap"><table id="decisions"></table></div>
      </div>
    </section>

    <section id="tab-profile" role="tabpanel" hidden>
      <div class="row">
        <label class="field">Metric
          <select id="profile-metric"></select>
        </label>
      </div>
      <figure id="chart-profile" class="card chart"></figure>
    </section>
  </main>

  <footer>
    Read-only dashboard. Data also available as JSON at
    <a href="/api/overview">/api/overview</a>, <a href="/status">/status</a> and <a href="/history">/history</a>,
    and as Prometheus metrics at <a href="/metrics">/metrics</a>.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
